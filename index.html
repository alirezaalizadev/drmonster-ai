/* ---------------- AI assistant (Claude proposes; the app verifies & computes) ---------------- */
// Calls the ai-invoice Edge Function. The Anthropic key never touches the browser;
// this sends the user's Supabase JWT so the function can authenticate the request.
async function callAI(payload){
  await SB.ensureFresh();
  const r=await fetch(`${SB.url}/functions/v1/ai-invoice`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+(SB.session&&SB.session.access_token)},body:JSON.stringify(payload)});
  const t=await r.text(); let d={}; try{ d=t?JSON.parse(t):{}; }catch(e){ d={error:t}; }
  if(r.status===404) throw new Error("The AI assistant isn't deployed yet. Deploy the ai-invoice Edge Function and set ANTHROPIC_API_KEY — see SUPABASE_SETUP.md.");
  if(r.status===401) throw new Error("Session expired. Sign in again to use the assistant.");
  if(!r.ok) throw new Error(d.error||("Request failed ("+r.status+")"));
  return d;
}
function normName(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
// Match a Claude-proposed name against the verified Companies database (app decides, not AI).
function matchCompany(name){
  const n=normName(name); if(!n)return null; let best=null,score=0;
  for(const c of companies){ const cn=normName(c.name); let s=0;
    if(cn===n)s=100; else if(cn.includes(n)||n.includes(cn))s=72;
    else { const a=new Set(n.split(" ")), b=cn.split(" "); const inter=b.filter(w=>a.has(w)).length; s=inter/Math.max(1,Math.max(a.size,b.length))*60; }
    if(s>score){score=s;best=c;} }
  return score>=45?best:null;
}
// Build a proposed draft from Claude's structured fields. Company data comes ONLY from
// the matched DB record; quantities/prices are validated; nothing sensitive is taken from AI.
function buildProposal(p){
  const after=JSON.parse(JSON.stringify(draft));
  const warnings=[]; const needs=Array.isArray(p.needs)?p.needs.slice():[];
  if(p.seller_name){ const m=matchCompany(p.seller_name); if(m){ after.sellerId=m.id; after.seller=null; } else warnings.push(`Seller “${p.seller_name}” isn't in your Companies. Add it on the Companies page first — company details are loaded from your database, never invented.`); }
  if(p.buyer_name){ const m=matchCompany(p.buyer_name); if(m){ after.buyerId=m.id; after.buyer=null; } else warnings.push(`Buyer “${p.buyer_name}” isn't in your Companies. Add it on the Companies page first.`); }
  if(p.currency && CURRENCIES.some(c=>c.code===p.currency)) after.currency=p.currency;
  else if(!p.currency && p.seller_name){ const s=companies.find(c=>c.id===after.sellerId); if(s&&s.currency) after.currency=s.currency; }
  if(Array.isArray(p.items) && p.items.length){
    after.items=p.items.map((it,idx)=>{
      const desc=String(it.description||"").trim(); const label=desc||("item "+(idx+1));
      let q=it.quantity, up=it.unit_price;
      if(q==null||!isFinite(q)){ needs.push("Quantity for "+label); q=0; }
      if(up==null||!isFinite(up)){ needs.push("Unit price for "+label); up=0; }
      return { id:uid("li"), description:desc, quantity:Math.max(0,Number(q)||0), unit:String(it.unit||"").trim(), unitPrice:Math.max(0,Number(up)||0) };
    });
  }
  if(p.shipping_route!=null) after.shippingRoute=String(p.shipping_route);
  if(p.payment_terms!=null) after.paymentTerms=String(p.payment_terms);
  if(p.notes!=null) after.notes=String(p.notes);
  return { after, rows:computeDiff(draft,after), warnings, needs:[...new Set(needs)], message:p.message||"" };
}
// OLD → NEW diff. Totals are recomputed here in application code.
function computeDiff(before,after){
  const rows=[]; const nameOf=(d,which)=>{ const c=companies.find(x=>x.id===d[which+"Id"])||d[which]; return c?c.name:"—"; };
  if(before.sellerId!==after.sellerId) rows.push(["Seller",nameOf(before,"seller"),nameOf(after,"seller")]);
  if(before.buyerId!==after.buyerId) rows.push(["Buyer",nameOf(before,"buyer"),nameOf(after,"buyer")]);
  if(before.currency!==after.currency) rows.push(["Currency",before.currency,after.currency]);
  if((before.shippingRoute||"")!==(after.shippingRoute||"")) rows.push(["Shipping route",before.shippingRoute||"—",after.shippingRoute||"—"]);
  if((before.paymentTerms||"")!==(after.paymentTerms||"")) rows.push(["Payment terms",before.paymentTerms||"—",after.paymentTerms||"—"]);
  if((before.notes||"")!==(after.notes||"")) rows.push(["Notes",before.notes||"—",after.notes||"—"]);
  const key=a=>JSON.stringify(a.map(i=>[i.description,i.quantity,i.unit,i.unitPrice]));
  const itemsChanged=key(before.items)!==key(after.items);
  if(itemsChanged){
    if(before.items.length===after.items.length){
      after.items.forEach((it,idx)=>{ const b=before.items[idx];
        if((b.description||"")!==(it.description||"")) rows.push([`Item ${idx+1} description`,b.description||"—",it.description||"—"]);
        if(b.quantity!==it.quantity) rows.push([`Item ${idx+1} quantity`,String(b.quantity),String(it.quantity)]);
        if((b.unit||"")!==(it.unit||"")) rows.push([`Item ${idx+1} unit`,b.unit||"—",it.unit||"—"]);
        if(b.unitPrice!==it.unitPrice) rows.push([`Item ${idx+1} unit price`,money(b.unitPrice,before.currency),money(it.unitPrice,after.currency)]);
      });
    } else {
      rows.push(["Products",`${before.items.length} line(s)`,after.items.map(i=>`${i.quantity||0}×${i.description||"—"}`).join(", ")||"—"]);
    }
  }
  if(itemsChanged || before.currency!==after.currency){
    rows.push(["Total",money(computeTotals(before.items,before.currency).total,before.currency),money(computeTotals(after.items,after.currency).total,after.currency)]);
  }
  return rows;
}
async function askClaude(){
  if(ai.busy||!draft)return;
  const kind=draft.docType==="contract"?"contract":"invoice";
  if(isFinalized(draft)){ ai.error="This "+kind+" is finalized — create a revision to use the assistant."; render(); return; }
  const instr=(ai.instruction||"").trim();
  if(!instr){ ai.error="Type an instruction first."; render(); return; }
  ai.busy=true; ai.error=""; render();
  try{
    const has=draft.sellerId||draft.buyerId||draft.items.some(i=>i.description.trim());
    const cd=has?{ currency:draft.currency,
      sellerName:(companies.find(c=>c.id===draft.sellerId)||draft.seller||{}).name||null,
      buyerName:(companies.find(c=>c.id===draft.buyerId)||draft.buyer||{}).name||null,
      items:draft.items.map(i=>({description:i.description,model:i.model||null,quantity:i.quantity,unit:i.unit,unitPrice:i.unitPrice,origin:i.origin||null,hsCode:i.hsCode||null})),
      shippingRoute:draft.shippingRoute, paymentTerms:draft.paymentTerms, notes:draft.notes }:null;
    if(cd&&kind==="contract"){
      cd.contractType=draft.contract.ctype;
      cd.terms=draft.contract.terms;
      cd.clauses=(draft.contract.clauses||[]).map(cl=>({title:cl.title,body:String(cl.body||"").slice(0,1500)}));
    }
    const res=await callAI({ instruction:instr, mode:kind, companyNames:companies.map(c=>c.name), currentDraft:cd });
    ai.busy=false;
    if(!res.proposal){ ai.error="No proposal returned."; render(); return; }
    ai.proposal = kind==="contract" ? buildContractProposal(res.proposal) : buildProposal(res.proposal);
    render();

/* Build a proposed CONTRACT draft from Claude's structured output. Companies come from
   the DB, quantities/prices are validated, totals computed by the app; clause ops are
   applied to a copy and everything is shown as OLD → NEW before applying. */
function buildContractProposal(p){
  const after=JSON.parse(JSON.stringify(draft));
  if(!after.contract) after.contract={ctype:"sales",terms:emptyTerms(),clauses:[],sig:{sellerRep:"",sellerTitle:"",buyerRep:"",buyerTitle:""},custom:false};
  const warnings=[]; const needs=Array.isArray(p.needs)?p.needs.slice():[];
  const rows=[];
  if(p.contract_type && CONTRACT_TYPES.some(x=>x.id===p.contract_type) && p.contract_type!==after.contract.ctype){
    rows.push(["Contract type",ctypeLabel(after.contract.ctype),ctypeLabel(p.contract_type)]);
    after.contract.ctype=p.contract_type;
    if(!after.contract.custom) after.contract.clauses=defaultClauses(p.contract_type);
  }
  const nameOf=(d,w)=>{ const co=companies.find(x=>x.id===d[w+"Id"])||d[w]; return co?co.name:"—"; };
  if(p.seller_name){ const m=matchCompany(p.seller_name); if(m){ if(m.id!==after.sellerId){rows.push(["Seller",nameOf(after,"seller"),m.name]);} after.sellerId=m.id; after.seller=null; } else warnings.push(`Seller “${p.seller_name}” isn't in your Companies. Add it first — company data is loaded from your database, never invented.`); }
  if(p.buyer_name){ const m=matchCompany(p.buyer_name); if(m){ if(m.id!==after.buyerId){rows.push(["Buyer",nameOf(after,"buyer"),m.name]);} after.buyerId=m.id; after.buyer=null; } else warnings.push(`Buyer “${p.buyer_name}” isn't in your Companies. Add it first.`); }
  if(p.currency && CURRENCIES.some(x=>x.code===p.currency) && p.currency!==after.currency){ rows.push(["Currency",after.currency,p.currency]); after.currency=p.currency; }
  else if(!p.currency && p.seller_name){ const s=companies.find(x=>x.id===after.sellerId); if(s&&s.currency&&s.currency!==after.currency){ rows.push(["Currency",after.currency,s.currency]); after.currency=s.currency; } }
  if(Array.isArray(p.items)&&p.items.length){
    const beforeItems=after.items;
    after.items=p.items.map((it,idx)=>{
      const desc=String(it.description||"").trim(); const label=desc||("item "+(idx+1));
      let q=it.quantity, up=it.unit_price;
      if(q==null||!isFinite(q)){ needs.push("Quantity for "+label); q=0; }
      if(up==null||!isFinite(up)){ needs.push("Unit price for "+label); up=0; }
      return { id:uid("li"), description:desc, model:String(it.model||"").trim(), quantity:Math.max(0,Number(q)||0), unit:String(it.unit||"").trim(), unitPrice:Math.max(0,Number(up)||0), origin:String(it.origin||"").trim(), hsCode:String(it.hs_code||"").trim() };
    });
    const key=a=>JSON.stringify(a.map(i=>[i.description,i.model,i.quantity,i.unit,i.unitPrice,i.origin,i.hsCode]));
    if(key(beforeItems)!==key(after.items)){
      if(beforeItems.length===after.items.length){
        after.items.forEach((it,idx)=>{ const b=beforeItems[idx];
          if((b.description||"")!==(it.description||"")) rows.push([`Product ${idx+1} description`,b.description||"—",it.description||"—"]);
          if(b.quantity!==it.quantity) rows.push([`Product ${idx+1} quantity`,String(b.quantity),String(it.quantity)]);
          if((b.model||"")!==(it.model||"")) rows.push([`Product ${idx+1} model`,b.model||"—",it.model||"—"]);
          if(b.unitPrice!==it.unitPrice) rows.push([`Product ${idx+1} unit price`,money(b.unitPrice,draft.currency),money(it.unitPrice,after.currency)]);
          if((b.origin||"")!==(it.origin||"")) rows.push([`Product ${idx+1} origin`,b.origin||"—",it.origin||"—"]);
        });
      } else rows.push(["Products",`${beforeItems.length} line(s)`,after.items.map(i=>`${i.quantity||0}×${i.description||"—"}`).join(", ")||"—"]);
    }
  }
  const TERM_LABELS={payment:"Payment terms",delivery:"Delivery terms",delivery_period:"Delivery period",shipping_origin:"Shipping origin",shipping_destination:"Shipping destination",shipping_method:"Shipping method",incoterm:"Incoterm",origin_country:"Country of origin",inspection:"Inspection terms",warranty:"Warranty terms",packaging:"Packaging terms",insurance:"Insurance terms",additional:"Additional terms"};
  const TERM_KEYS={payment:"payment",delivery:"delivery",delivery_period:"deliveryPeriod",shipping_origin:"shipOrigin",shipping_destination:"shipDest",shipping_method:"shipMethod",incoterm:"incoterm",origin_country:"originCountry",inspection:"inspection",warranty:"warranty",packaging:"packaging",insurance:"insurance",additional:"additional"};
  if(p.terms){ for(const k in TERM_KEYS){ const v=p.terms[k]; if(v!=null&&String(v).trim()!==""){ const ak=TERM_KEYS[k]; const old=after.contract.terms[ak]||"—"; if(old!==String(v)){ rows.push([TERM_LABELS[k],old,String(v)]); after.contract.terms[ak]=String(v); } } } }
  const trunc=s=>{ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>90?s.slice(0,90)+"…":s; };
  if(Array.isArray(p.clause_ops)){
    for(const op of p.clause_ops){
      const title=String(op.title||"").trim(); if(!title)continue;
      const norm=s=>String(s).toLowerCase().trim();
      const idx=after.contract.clauses.findIndex(x=>norm(x.title)===norm(title)||norm(x.title).includes(norm(title))||norm(title).includes(norm(x.title)));
      if(op.op==="remove"){ if(idx>=0){ rows.push(["Remove clause “"+after.contract.clauses[idx].title+"”",trunc(after.contract.clauses[idx].body),"(removed)"]); after.contract.clauses.splice(idx,1); after.contract.custom=true; } else warnings.push(`Clause “${title}” wasn't found, so nothing was removed.`); }
      else if(op.op==="add"){ const cl={id:uid("cl"),title,body:String(op.body||"")}; let pos=(op.position&&op.position>=1)?Math.min(op.position-1,after.contract.clauses.length):after.contract.clauses.length; after.contract.clauses.splice(pos,0,cl); after.contract.custom=true; rows.push(["Add clause “"+title+"”","—",trunc(cl.body)||"(empty)"]); }
      else if(op.op==="update"){ if(idx>=0){ const old=after.contract.clauses[idx].body; after.contract.clauses[idx].body=String(op.body||""); after.contract.custom=true; rows.push(["Rewrite clause “"+after.contract.clauses[idx].title+"”",trunc(old),trunc(op.body)]); } else { const cl={id:uid("cl"),title,body:String(op.body||"")}; after.contract.clauses.push(cl); after.contract.custom=true; rows.push(["Add clause “"+title+"”","—",trunc(cl.body)]); warnings.push(`Clause “${title}” wasn't found — it was added as a new clause instead.`); } }
    }
  }
  const beforeTotal=computeTotals(draft.items,draft.currency), afterTotal=computeTotals(after.items,after.currency);
  if(beforeTotal.total!==afterTotal.total||draft.currency!==after.currency) rows.push(["Calculated total",money(beforeTotal.total,draft.currency),money(afterTotal.total,after.currency)]);
  return { after, rows, warnings, needs:[...new Set(needs)], message:p.message||"" };
}

const ALLOWED_DOC="application/pdf,.pdf,.docx,image/png,.png,image/jpeg,.jpg,.jpeg";
function fileKind(file){ const n=(file.name||"").toLowerCase(), t=file.type||"";
  if(t==="application/pdf"||n.endsWith(".pdf"))return "pdf";
  if(t.includes("wordprocessingml")||n.endsWith(".docx"))return "docx";
  if(t==="image/png"||n.endsWith(".png"))return "image";
  if(t==="image/jpeg"||n.endsWith(".jpg")||n.endsWith(".jpeg"))return "image";
  return null;
}
function u8ToBase64(u8){ let bin=""; const chunk=0x8000; for(let i=0;i<u8.length;i+=chunk)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk)); return btoa(bin); }
async function fileToBase64(file){ return u8ToBase64(new Uint8Array(await file.arrayBuffer())); }
async function downscaleImage(file){
  const dataUrl=await fileToDataUrl(file);
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl;});
  const max=1600; let w=img.naturalWidth||max,h=img.naturalHeight||max; const s=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
  const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
  const out=c.toDataURL("image/jpeg",0.85);
  return { dataBase64: out.split(",")[1], mediaType:"image/jpeg" };
}
async function inflateRaw(bytes){ if(typeof DecompressionStream==="undefined")throw new Error("no-inflate"); const ds=new DecompressionStream("deflate-raw"); const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer(); return new Uint8Array(ab); }
// Read word/document.xml out of a .docx (ZIP) and reduce it to plain text — no libraries.
async function docxToText(file){
  const buf=new Uint8Array(await file.arrayBuffer()); const dv=new DataView(buf.buffer);
  let eocd=-1; for(let i=buf.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error("bad-docx");
  const cdOff=dv.getUint32(eocd+16,true), cnt=dv.getUint16(eocd+10,true); let p=cdOff, target=null;
  for(let n=0;n<cnt && p+46<=buf.length;n++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true), fnLen=dv.getUint16(p+28,true), exLen=dv.getUint16(p+30,true), cmLen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+fnLen));
    if(name==="word/document.xml"){ target={method,compSize,lho}; break; }
    p+=46+fnLen+exLen+cmLen;
  }
  if(!target)throw new Error("no-docxml");
  const lfnLen=dv.getUint16(target.lho+26,true), lexLen=dv.getUint16(target.lho+28,true);
  const start=target.lho+30+lfnLen+lexLen; const comp=buf.subarray(start,start+target.compSize);
  const xmlBytes= target.method===0 ? comp : await inflateRaw(comp);
  let xml=new TextDecoder("utf-8").decode(xmlBytes);
  xml=xml.replace(/<w:tab\b[^>]*\/>/g,"\t").replace(/<\/w:p>/g,"\n").replace(/<w:br\b[^>]*\/?>/g,"\n");
  return xml.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/\n{3,}/g,"\n\n").trim();
}
async function buildExtractPayload(file,kind){
  if(kind==="docx"){ let text; try{ text=await docxToText(file); }catch(e){ const why=String(e.message||e)==="no-inflate"?" (this browser can't decompress it)":""; throw new Error("Couldn't read the DOCX contents"+why+". Try exporting the document as a PDF and uploading that."); } if(!text||text.trim().length<5) throw new Error("No readable text was found in that DOCX. Export it as a PDF and upload that instead."); return { text }; }
  if(kind==="image") return await downscaleImage(file);
  const b64=await fileToBase64(file); if(b64.length>7500000) throw new Error("This PDF is too large to analyse. Upload a smaller/compressed PDF, or a page image."); return { dataBase64:b64, mediaType:"application/pdf" };
}
async function callExtract(payload){
  await SB.ensureFresh();
  const r=await fetch(`${SB.url}/functions/v1/ai-document`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+(SB.session&&SB.session.access_token)},body:JSON.stringify(payload)});
  const t=await r.text(); let d={}; try{ d=t?JSON.parse(t):{}; }catch(e){ d={error:t}; }
  if(r.status===404) throw new Error("Document analysis isn't deployed yet. Deploy the ai-document Edge Function and set ANTHROPIC_API_KEY — see SUPABASE_SETUP.md.");
  if(r.status===413) throw new Error("That file is too large for analysis. Try a smaller or compressed file.");
  if(!r.ok) throw new Error(d.error||("Request failed ("+r.status+")"));

}
function num(v){ return (v!=null && isFinite(v)) ? Math.max(0,Number(v)) : 0; }
function parseIsoDate(s){ if(!s)return null; if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return isNaN(new Date(s+"T00:00:00"))?null:s; const d=new Date(s); if(isNaN(d))return null; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
// Build an editable draft from the extracted fields. Companies are matched to the DB
// (verified data); quantities/prices are validated; totals are computed by the app.
function buildDraftFromExtraction(ext,source){
  const d=freshDraft(); d.source=source;
  d.numberMode = ext.doc_number ? "manual" : "auto";
  if(ext.doc_number) d.number=String(ext.doc_number);
  const iso=parseIsoDate(ext.doc_date); if(iso) d.date=iso;
  if(ext.currency && CURRENCIES.some(c=>c.code===ext.currency)) d.currency=ext.currency;
  if(Array.isArray(ext.items)&&ext.items.length){
    const items=ext.items.filter(it=>it && String(it.description||"").trim()).map(it=>({id:uid("li"),description:String(it.description||"").trim(),quantity:num(it.quantity),unit:String(it.unit||"").trim(),unitPrice:num(it.unit_price)}));
    if(items.length) d.items=items;
  }
  d.shippingRoute=ext.shipping_route?String(ext.shipping_route):"";
  d.paymentTerms=ext.payment_terms?String(ext.payment_terms):"";
  d.notes=ext.notes?String(ext.notes):"";
  if(ext.seller_name){ const m=matchCompany(ext.seller_name); if(m)d.sellerId=m.id; else d.seller={name:String(ext.seller_name),address:ext.seller_address?String(ext.seller_address):"",taxId:ext.seller_tax?String(ext.seller_tax):"",bank:{},_unverified:true}; }
  if(ext.buyer_name){ const m=matchCompany(ext.buyer_name); if(m)d.buyerId=m.id; else d.buyer={name:String(ext.buyer_name),address:ext.buyer_address?String(ext.buyer_address):"",taxId:ext.buyer_tax?String(ext.buyer_tax):"",bank:{},_unverified:true}; }
  return d;
}
async function handleUpload(file){
  if(uploading||!file)return;
  const kind=fileKind(file);
  if(!kind){ toast("Unsupported file. Upload PDF, DOCX, PNG, JPG or JPEG.",true); return; }
  if(file.size>10*1024*1024){ toast("File is larger than 10 MB — please upload a smaller file.",true); return; }
  uploading=true; uploadMsg="Preserving your original & analysing it with Claude…"; render();
  try{
    // (1)(2) Preserve the original — write-once random path; never overwritten.
    const safe=(file.name||"document").replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`${SB.uid}/${Math.random().toString(36).slice(2,10)}-${safe}`;
    await SB.upload(SOURCE_BUCKET,path,file);
    // (3)(4) Analyse & extract fields.
    const payload=await buildExtractPayload(file,kind); payload.companyNames=companies.map(c=>c.name);
    const res=await callExtract(payload);
    const ext=res.extraction||{};
    const url=await SB.signedUrl(SOURCE_BUCKET,path,3600);
    const source={ path, name:file.name, type:kind, url, extraction:ext, textPreview: kind==="docx"?(payload.text||"").slice(0,4000):null };
    draft=buildDraftFromExtraction(ext,source);
    genMsg=null; preview=null; ai.proposal=null; ai.instruction=""; ai.error=""; srcOpen=true; extOpen=false;
    uploading=false; route="new"; window.scrollTo(0,0); render();
    if(ext.is_invoice===false) toast("This doesn't look like an invoice — extracted fields may be sparse. Review carefully.",true);
    else toast("Analysed. Review the extracted fields, then tell the assistant what to change.");
  }catch(err){ uploading=false; render(); toast("Upload / analysis failed: "+(err.message||err),true); }
}

  const {seller,buyer}=resolveParties(doc);
  const root=document.getElementById("print-root");
  root.innerHTML=renderDocA4(doc,seller,buyer);
  try{ await waitForImages(root); }catch(e){}
  window.print();

// Fetch any logo (data: or signed http URL) and return a clean same-origin data URL (no canvas taint).
async function logoDataUrl(logo){
  if(!logo||!logo.dataUrl)return null;
  if(logo.dataUrl.startsWith("data:"))return logo.dataUrl;
  try{ const r=await fetch(logo.dataUrl); const b=await r.blob(); return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=rej;fr.readAsDataURL(b);}); }
  catch(e){ return null; }
}
// Rasterize a logo to PNG bytes at 2x for crisp output; preserve aspect ratio via the size cap.
async function logoPng(doc){
  const logo=resolveLogo(doc); if(!logo)return null;
  const dataUrl=await logoDataUrl(logo); if(!dataUrl)return null;
  const cap=LOGO_CAPS[doc.logoSize||"medium"];
  const disp=fitLogo(logo.width,logo.height,cap);
  const scale=2, cw=Math.max(1,Math.round(disp.w*scale)), ch=Math.max(1,Math.round(disp.h*scale));
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl;});
  const canvas=document.createElement("canvas"); canvas.width=cw; canvas.height=ch;
  const ctx=canvas.getContext("2d"); ctx.clearRect(0,0,cw,ch); ctx.drawImage(img,0,0,cw,ch);
  const pngUrl=canvas.toDataURL("image/png");
  const bytes=base64ToU8(pngUrl.split(",")[1]);
  return { bytes, wEmu:Math.round(disp.w*9525), hEmu:Math.round(disp.h*9525) };
}

async function exportDOCX(doc){
  try{
    const {seller,buyer}=resolveParties(doc);
    const logo=await logoPng(doc).catch(()=>null);
    const parts = doc.docType==="contract" ? buildContractDocx(doc,seller,buyer,logo) : buildDocx(doc,seller,buyer,logo);
    const blob=zipStore(parts);
    downloadBlob(blob,(doc.number||(doc.docType==="contract"?"contract":"invoice")).replace(/[^\w.-]+/g,"_")+".docx");
  }catch(err){ toast("Could not export DOCX: "+(err.message||err),true); }
}

/* ---- OOXML (.docx) builder for CONTRACTS — reuses wRun/wPara/wCell + the same packaging ---- */
function docxParts(bodyArr,NS,logo){
  const sect=`<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`;
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document ${NS}><w:body>${bodyArr.join("")}${sect}</w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${logo?`<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>`:""}</Relationships>`;
  const parts=[
    {name:"[Content_Types].xml", data:strToU8(contentTypes)},
    {name:"_rels/.rels", data:strToU8(rels)},
    {name:"word/document.xml", data:strToU8(documentXml)},
    {name:"word/_rels/document.xml.rels", data:strToU8(docRels)},
  ];
  if(logo) parts.push({name:"word/media/logo.png", data:logo.bytes});
  return parts;
}

  body.push(wPara(wRun("Contract: "+(doc.number||"—")+"     Date: "+fdate(doc.date)+(doc.revision>1?"     Revision "+doc.revision:""),{sz:20,color:"4C5973"}),{border:true,spacing:[0,160]}));

  body.push(`<w:tbl><w:tblPr><w:tblW w:w="9638" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4819"/><w:gridCol w:w="4819"/></w:tblGrid>`+
    `<w:tr>${wCell(wRun("SELLER",{b:1,sz:16,color:"1E3AAE",caps:1}),4819)}${wCell(wRun("BUYER",{b:1,sz:16,color:"1E3AAE",caps:1}),4819)}</w:tr>`+
    `<w:tr>${wCell(partyText(seller),4819)}${wCell(partyText(buyer),4819)}</w:tr></w:tbl>`);
  body.push(wPara(""));
  // product table (8 columns)
  const items=doc.items.filter(i=>i.description.trim());
  if(items.length){
    const cols=[2400,1300,700,700,1200,1400,1000,938];
    const hdr=(txt,i,al)=>wCell(wRun(txt,{b:1,sz:14,color:"4C5973",caps:1}),cols[i],{shd:"F6F7F9",align:al});
    let rows=`<w:tr>${hdr("Description",0)}${hdr("Model/Spec",1)}${hdr("Qty",2,"right")}${hdr("Unit",3)}${hdr("Unit price",4,"right")}${hdr("Line total",5,"right")}${hdr("Origin",6)}${hdr("HS/CN",7)}</w:tr>`;

    termRows.forEach(r=>body.push(wPara(wRun(r[0]+": ",{b:1,sz:18})+wRun(String(r[1]),{sz:18,color:"3E485D"}))));
  }

  body.push(wPara(wRun("SIGNATURES",{b:1,sz:16,color:"61708C",caps:1}),{border:true,spacing:[300,120]}));
  body.push(`<w:tbl><w:tblPr><w:tblW w:w="9638" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4819"/><w:gridCol w:w="4819"/></w:tblGrid>`+
    `<w:tr>${wCell(sigCell("Seller",seller,sig.sellerRep,sig.sellerTitle),4819)}${wCell(sigCell("Buyer",buyer,sig.buyerRep,sig.buyerTitle),4819)}</w:tr></w:tbl>`);
  return docxParts(body,NS,logo);
}
function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }

/* ---- OOXML (.docx) builder — no external libraries ---- */
function xesc(s){ return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/"/g,"&quot;"); }
function wRun(text,o){ o=o||{}; const rpr=[]; if(o.b)rpr.push("<w:b/>"); if(o.i)rpr.push("<w:i/>"); if(o.color)rpr.push(`<w:color w:val="${o.color}"/>`); if(o.sz)rpr.push(`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`); if(o.caps)rpr.push('<w:caps/>');
  const parts=String(text??"").split("\n"); const runs=parts.map((p,i)=>`<w:r>${rpr.length?`<w:rPr>${rpr.join("")}</w:rPr>`:""}${i?"<w:br/>":""}<w:t xml:space="preserve">${xesc(p)}</w:t></w:r>`).join(""); return runs; }
function wPara(runsXml,o){ o=o||{}; const ppr=[]; if(o.align)ppr.push(`<w:jc w:val="${o.align}"/>`); if(o.spacing)ppr.push(`<w:spacing w:before="${o.spacing[0]||0}" w:after="${o.spacing[1]||0}"/>`); if(o.shd)ppr.push(`<w:shd w:val="clear" w:fill="${o.shd}"/>`); if(o.border)ppr.push('<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="4" w:color="D4D9E2"/></w:pBdr>');
  return `<w:p>${ppr.length?`<w:pPr>${ppr.join("")}</w:pPr>`:""}${runsXml}</w:p>`; }
function wCell(runsXml,wdth,o){ o=o||{}; const shd=o.shd?`<w:shd w:val="clear" w:fill="${o.shd}"/>`:""; const jc=o.align?`<w:jc w:val="${o.align}"/>`:""; return `<w:tc><w:tcPr><w:tcW w:w="${wdth}" w:type="dxa"/>${shd}</w:tcPr><w:p>${jc?`<w:pPr>${jc}</w:pPr>`:""}${runsXml}</w:p></w:tc>`; }

/* ---- minimal helpers: text/base64 -> bytes, and a STORED (no-compression) ZIP writer ---- */
function strToU8(s){ return new TextEncoder().encode(s); }
function base64ToU8(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(entries){
  const enc=entries.map(e=>({name:strToU8(e.name), data:e.data, crc:crc32(e.data)}));
  let size=0; enc.forEach(e=>{ size+=30+e.name.length+e.data.length; size+=46+e.name.length; }); size+=22;
  const buf=new Uint8Array(size); const dv=new DataView(buf.buffer); let off=0; const central=[];
  for(const e of enc){
    const local=off;
    dv.setUint32(off,0x04034b50,true); off+=4;
    dv.setUint16(off,20,true); off+=2;      // version needed
    dv.setUint16(off,0,true); off+=2;        // flags
    dv.setUint16(off,0,true); off+=2;        // method 0 = store
    dv.setUint16(off,0,true); off+=2;        // mod time
    dv.setUint16(off,0x21,true); off+=2;     // mod date
    dv.setUint32(off,e.crc,true); off+=4;
    dv.setUint32(off,e.data.length,true); off+=4;
    dv.setUint32(off,e.data.length,true); off+=4;
    dv.setUint16(off,e.name.length,true); off+=2;
    dv.setUint16(off,0,true); off+=2;        // extra len
    buf.set(e.name,off); off+=e.name.length;
    buf.set(e.data,off); off+=e.data.length;
    central.push({e,local});
  }
  const cstart=off;
  for(const {e,local} of central){
    dv.setUint32(off,0x02014b50,true); off+=4;
    dv.setUint16(off,20,true); off+=2;       // version made by
    dv.setUint16(off,20,true); off+=2;       // version needed
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0x21,true); off+=2;
    dv.setUint32(off,e.crc,true); off+=4;
    dv.setUint32(off,e.data.length,true); off+=4;
    dv.setUint32(off,e.data.length,true); off+=4;
    dv.setUint16(off,e.name.length,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint16(off,0,true); off+=2;
    dv.setUint32(off,0,true); off+=4;
    dv.setUint32(off,local,true); off+=4;
    buf.set(e.name,off); off+=e.name.length;
  }
  const csize=off-cstart;
  dv.setUint32(off,0x06054b50,true); off+=4;
  dv.setUint16(off,0,true); off+=2;
  dv.setUint16(off,0,true); off+=2;
  dv.setUint16(off,central.length,true); off+=2;
  dv.setUint16(off,central.length,true); off+=2;
  dv.setUint32(off,csize,true); off+=4;
  dv.setUint32(off,cstart,true); off+=4;
  dv.setUint16(off,0,true); off+=2;
  return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- events ---------------- */
document.addEventListener("submit",e=>{ const a=e.target.closest('[data-act="auth-submit"]'); if(a){ e.preventDefault(); doAuth(); } });
document.addEventListener("click",e=>{
  const a=e.target&&e.target.closest&&e.target.closest("[data-act]");
  const act=a&&a.dataset.act;
  // auth / connection
  if(act==="save-connect"){ if(!connect.url.trim()||!connect.key.trim()){connect.error="Enter both the project URL and the anon key.";render();return;} connect.error=""; SB.setConfig(connect.url,connect.key); render(); return; }
  if(act==="auth-toggle"){ auth.mode=auth.mode==="signup"?"signin":"signup"; auth.error=""; auth.notice=""; render(); return; }
  if(act==="reconnect"){ SB.clearConfig(); connect.url=SB.url; connect.key=SB.key; render(); return; }
  if(act==="sign-out"){ SB.signOut().then(()=>{ companies=[]; invoices=[]; for(const k in files)delete files[k]; draft=null; genMsg=null; section=""; route="dashboard"; render(); }); return; }
  if(act==="disconnect"){ SB.signOut().then(()=>{ SB.clearConfig(); connect.url=""; connect.key=""; companies=[]; invoices=[]; render(); }); return; }
  // navigation ("New Document" always starts a clean draft when the current one is saved/locked)
  const r=e.target&&e.target.closest&&e.target.closest("[data-route]"); if(r){ const nr=r.dataset.route; preview=null; ai.proposal=null;
    if((nr==="new"||nr==="invoice") && draft && (draft.id||isFinalized(draft)||draft.docType==="contract")){ draft=freshDraft(); ai.instruction=""; ai.error=""; }
    if(nr==="contract" && draft && (draft.id||isFinalized(draft)) && draft.docType==="contract"){ draft=freshContractDraft(); ai.instruction=""; ai.error=""; }
    route=nr; window.scrollTo(0,0); render(); return; }
  if(!a)return;
  const id=a.dataset.id;
  if(act==="enter-section"){ const s=SECTIONS.find(x=>x.id===id&&x.enabled); if(s){ section=s.id; route=(MODULES[s.id]||{}).home||"dashboard"; window.scrollTo(0,0); render(); } return; }
  if(act==="exit-section"){ section=""; window.scrollTo(0,0); render(); return; }
  // ---- Company Risk Intelligence ----
  if(act==="risk-go-new"){ risk.result=null; risk.invId=null; risk.saved=false; risk.error=""; route="risk-new"; window.scrollTo(0,0); render(); return; }
  if(act==="risk-adv"){ risk.adv=!risk.adv; render(); return; }
  if(act==="risk-run"){ runRiskCheck(); return; }
  if(act==="risk-open"){ riskOpen(id); return; }
  if(act==="risk-del"){ riskDelete(id); return; }
  if(act==="risk-rerun"){ const inv=(risk.list||[]).find(x=>x.id===id); riskRerun(inv&&inv.company_name, inv&&inv.country); return; }
  if(act==="risk-save"){ riskSave(); return; }
  if(act==="risk-watch"){ riskWatchToggle(); return; }
  if(act==="risk-watch-rm"){ riskWatchRemove(id); return; }
  if(act==="risk-report"){ exportRiskReport(); return; }
  if(act==="risk-tab"){ risk.tab=id; render(); return; }
  if(act==="risk-node"){ risk.tab="evidence"; render(); return; }
  if(act==="risk-decide"){ riskDecision(id, a.dataset.v); return; }
  if(act==="co-new"){modal={editing:null};editDraft=emptyCompany();render();}
  if(act==="co-edit"){const c=companies.find(x=>x.id===id);modal={editing:c};editDraft={...c,bank:{...(c.bank||{})}};render();}
  if(act==="co-del"){deleteCompany(id);}
  if(act==="close-modal"){modal=null;editDraft=null;render();}
  if(act==="save-co"){saveCompany();}
  if(act==="add-item"){draft.items.push(newLine());render();}
  if(act==="rm-item"){if(draft.items.length>1)draft.items=draft.items.filter(x=>x.id!==id);render();}
  if(act==="dup-item"){const it=draft.items.find(x=>x.id===id); if(it){const i=draft.items.indexOf(it); draft.items.splice(i+1,0,{...it,id:uid("li")});} render();}
  // contract clauses + templates
  if(act==="new-contract"){draft=freshContractDraft(id); ai.instruction=""; ai.error=""; route="contract"; window.scrollTo(0,0); render();}
  if(act==="add-clause"){draft.contract.clauses.push({id:uid("cl"),title:"New clause",body:""}); draft.contract.custom=true; render();}
  if(act==="rm-clause"){draft.contract.clauses=draft.contract.clauses.filter(x=>x.id!==id); draft.contract.custom=true; render();}
  if(act==="cl-up"||act==="cl-down"){const arr=draft.contract.clauses; const i=arr.findIndex(x=>x.id===id); const j=act==="cl-up"?i-1:i+1; if(i>=0&&j>=0&&j<arr.length){const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp; draft.contract.custom=true; render();}}
  // invoice lifecycle
  if(act==="save-draft"){saveDraft();}
  if(act==="save-finalize"){finalizeDoc();}
  if(act==="create-revision"){createRevision();}
  if(act==="open-doc"){openDoc(id);}
  if(act==="del-doc"){confirmDeleteDoc(id);}
  if(act==="del-cancel"){delDoc=null;render();}
  if(act==="del-confirm"){performDeleteDoc();}
  if(act==="num-mode"){ draft.numberMode=a.dataset.v; if(draft.numberMode==="manual"&&!draft.number.trim())draft.number=projectedNumber(draft.date); render(); }
  if(act==="preview-export"){ openPreview(draft); }
  if(act==="close-preview"){ closePreview(); }
  if(act==="ai-toggle"){ ai.open=!ai.open; render(); }
  if(act==="ai-ask"){ askClaude(); }
  if(act==="ai-apply"){ applyProposal(); }
  if(act==="ai-cancel"){ ai.proposal=null; render(); }
  if(act==="doc-upload-pick"){ const el=document.getElementById("doc-upload-input"); if(el)el.click(); }
  if(act==="src-toggle"){ srcOpen=!srcOpen; render(); }
  if(act==="ext-toggle"){ extOpen=!extOpen; render(); }
  if(act==="download-original"){ if(draft&&draft.source&&draft.source.url) window.open(draft.source.url,"_blank"); }
  if(act==="export-pdf"){ exportPDF(preview?preview.doc:draft); }
  if(act==="export-docx"){ toast("Preparing DOCX…"); exportDOCX(preview?preview.doc:draft); }
  if(act==="save-numbering"){ saveNumbering(); }
  if(act==="brand-pick"){ const el=document.getElementById("brand-logo-input"); if(el)el.click(); }
  if(act==="brand-save"){ saveBrandLogo(); }
  if(act==="brand-cancel"){ brand.pending=null; render(); }
  if(act==="brand-remove"){ removeBrandLogo(); }
  if(act==="brand-size"){ if(settings.branding){ settings.branding.size=a.dataset.v; cacheBrand(cachedBrandLogo(), settings.branding.size); saveSettings().catch(()=>{}); render(); } }
  if(act==="lmode"){draft.logoMode=a.dataset.v;render();}
  if(act==="lsize"){draft.logoSize=a.dataset.v;render();}
  if(act==="co-logo-pick"){const el=document.getElementById("co-logo-input");if(el)el.click();}
  if(act==="co-logo-remove"){editDraft.logoKey=null;editDraft.logoPath=null;render();}
  if(act==="inv-logo-pick"){const el=document.getElementById("inv-logo-input");if(el)el.click();}
  if(act==="inv-logo-remove"){draft.customLogoKey=null;render();}
});

document.addEventListener("input",e=>{
  const rkf=e.target.dataset.rkf; if(rkf){ risk.form[rkf]=e.target.value; return; }
  const cf=e.target.dataset.cfield; if(cf){ connect[cf]=e.target.value; return; }
  const af=e.target.dataset.afield; if(af){ auth[af]=e.target.value; return; }
  const sf=e.target.dataset.sfield; if(sf){ if(sf==="nextSeq"){ settings.numbering.nextSeq=Math.max(1,parseInt(e.target.value||"1",10)||1); } else { settings.numbering[sf]=e.target.value; } const pv=document.getElementById("num-preview"); if(pv)pv.textContent=projectedNumber(new Date().toISOString().slice(0,10)); return; }
  const aif=e.target.dataset.aifield; if(aif){ ai[aif]=e.target.value; return; }
  const f=e.target.dataset.field;
  if(f&&draft){ draft[f]=e.target.value; updateLivePreview(); return; }
  if(e.target.dataset.item){
    const it=draft.items.find(x=>x.id===e.target.dataset.item);
    const k=e.target.dataset.k;
    it[k]= (k==="quantity"||k==="unitPrice") ? (parseFloat(e.target.value)||0) : e.target.value;
    // live-update amount + total + A4 without full re-render to keep focus
    if(k==="quantity"||k==="unitPrice"){ patchAmounts(); }
    updateLivePreview(); return;
  }
  // contract editor fields (terms / clauses / signatures) — update + live preview, no re-render
  const tk=e.target.dataset.term;
  if(tk&&draft&&draft.contract){ draft.contract.terms[tk]=e.target.value; updateLivePreview(); return; }
  const clId=e.target.dataset.clause;
  if(clId&&draft&&draft.contract){ const cl=draft.contract.clauses.find(x=>x.id===clId); if(cl){ cl[e.target.dataset.ck==="title"?"title":"body"]=e.target.value; draft.contract.custom=true; updateLivePreview(); } return; }
  const sg=e.target.dataset.sig;
  if(sg&&draft&&draft.contract){ draft.contract.sig[sg]=e.target.value; updateLivePreview(); return; }
  const mb=e.target.dataset.mbank;
  if(mb&&editDraft){ if(!editDraft.bank)editDraft.bank={}; editDraft.bank[mb]=e.target.value; return; }
  const mf=e.target.dataset.mfield;
  if(mf&&editDraft){ editDraft[mf]=e.target.value; if(mf==="name"){ const save=document.querySelector('[data-act="save-co"]'); if(save)save.disabled=!editDraft.name.trim()||busy; } }
});
document.addEventListener("change",e=>{
  if(e.target.dataset.act==="risk-demo"){ risk.demo=e.target.checked; return; }
  if(e.target.id==="doc-upload-input"){ const f=e.target.files&&e.target.files[0]; if(f)handleUpload(f); e.target.value=""; return; }
  if(e.target.id==="brand-logo-input"){ const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file)return; if(!validLogo(file)){ toast("Unsupported file type. Use PNG, JPG, JPEG, WebP or SVG.",true); return; } fileToDataUrl(file).then(dataUrl=>{ brand.pending={file,dataUrl,name:file.name}; render(); }).catch(()=>toast("Could not read that file.",true)); return; }
  if(e.target.id==="co-logo-input"){ const file=e.target.files&&e.target.files[0]; if(!file)return; if(!validLogo(file)){toast("Unsupported file type. Use PNG, JPG, JPEG, WebP or SVG.",true);e.target.value="";return;} toast("Uploading logo…"); uploadLogo(file).then(path=>{ if(editDraft){editDraft.logoPath=path;editDraft.logoKey=path;} render(); }).catch(err=>toast("Logo upload failed: "+err.message,true)); e.target.value=""; return; }
  if(e.target.id==="inv-logo-input"){ const file=e.target.files&&e.target.files[0]; if(!file)return; if(!validLogo(file)){toast("Unsupported file type. Use PNG, JPG, JPEG, WebP or SVG.",true);e.target.value="";return;} toast("Uploading logo…"); uploadLogo(file).then(path=>{ if(draft){draft.customLogoKey=path;draft.logoMode="custom";} render(); }).catch(err=>toast("Logo upload failed: "+err.message,true)); e.target.value=""; return; }
  const f=e.target.dataset.field;
  if(f&&draft&&(f==="sellerId"||f==="buyerId"||f==="currency"||f==="date")){
    draft[f]=e.target.value||null;
    if(f==="sellerId"){ const s=companies.find(c=>c.id===draft.sellerId); if(s&&s.currency)draft.currency=s.currency; }
    render();
  }
  const mf=e.target.dataset.mfield; if(mf==="currency"&&editDraft){ editDraft.currency=e.target.value; }
  // contract type: switch template (keeps clauses once the user has customized them)
  if(e.target.dataset.cfg==="ctype"&&draft&&draft.contract){
    draft.contract.ctype=e.target.value;
    if(!draft.contract.custom) draft.contract.clauses=defaultClauses(e.target.value);
    render();
  }
});

/* drag & drop onto the upload zone */
document.addEventListener("dragover",e=>{ const dz=e.target.closest&&e.target.closest("#dropzone"); if(dz){ e.preventDefault(); dz.classList.add("drag"); } });
document.addEventListener("dragleave",e=>{ const dz=e.target.closest&&e.target.closest("#dropzone"); if(dz)dz.classList.remove("drag"); });
document.addEventListener("drop",e=>{ const dz=e.target.closest&&e.target.closest("#dropzone"); if(dz){ e.preventDefault(); dz.classList.remove("drag"); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)handleUpload(f); } });

function patchAmounts(){
  // update each item line total + subtotal + total strip in place
  document.querySelectorAll(".item-box").forEach((box,idx)=>{
    const it=draft.items[idx]; if(!it)return;
    const amt=box.querySelector(".amount-box"); if(amt)amt.textContent=money(lineTotal(it,draft.currency),draft.currency);
  });
  const t=computeTotals(draft.items,draft.currency);
  const st=document.querySelector(".js-subtotal"); if(st)st.textContent=money(t.subtotal,draft.currency);
  const strip=document.querySelector(".total-strip .v"); if(strip)strip.textContent=money(t.total,draft.currency);
}
function updateLivePreview(){
  const seller=companies.find(c=>c.id===draft.sellerId)||(draft.seller||null);
  const buyer=companies.find(c=>c.id===draft.buyerId)||(draft.buyer||null);
  const host=document.querySelector(".a4-scale"); if(host)host.innerHTML=renderDocA4(draft,seller,buyer);
  refreshFinalize();
}
function refreshFinalize(){
  const canFinalize=!!(draft&&draft.date&&draft.items.some(i=>i.description.trim())&&!busy);
  document.querySelectorAll('[data-act="save-finalize"]').forEach(b=>{b.disabled=!canFinalize;});
}

/* ---------------- boot ---------------- */
(async function init(){
  // Optional: if the server injected public Supabase config (Railway env vars),
  // use it automatically on first load. The in-app "Connect Supabase" screen still
  // works as a fallback, and a user's manually-saved config always takes precedence.
  try{
    const cfg = (typeof window!=="undefined") ? window.__DRM_CONFIG__ : null;
    if(cfg && cfg.url && cfg.anonKey && !SB.configured()){ SB.setConfig(cfg.url, cfg.anonKey); connect.url=SB.url; connect.key=SB.key; }
  }catch(e){}
  render(); // connect or login immediately
  if(SB.configured() && SB.session){
    appState="loading"; render();
    try{
      await SB.ensureFresh();
      if(!SB.session){ appState="ready"; render(); return; } // session expired -> login
      await bootData();
      appState="ready"; render();
    }catch(err){
      appState="ready";
      if(/JWT|401|token|expired/i.test(String(err.message||err))){ SB.saveSession(null); }
      else { toast("Could not load your data: "+(err.message||err),true); }
      render();
    }
  }
})();
</script>
